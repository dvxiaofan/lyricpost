<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌词图片生成器</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/lib/html2canvas.min.js"></script>
    <script src="js/lib/FileSaver.min.js"></script>
    <!-- OpenCC 延迟加载，用户点击繁简转换时才加载 -->
</head>
<body class="dark-mode">
    <main>
        <!-- 步骤 1: 搜索歌曲 -->
        <section class="screen active" data-step="1">
            <div class="screen-content home-screen">
                <div class="home-hero">
                    <div class="hero-icon">
                        <img src="assets/img/music_1.png" alt="音乐" class="hero-img" width="50" height="50">
                    </div>
                    <h1>歌词图片生成器</h1>
                    <p class="subtitle">搜索歌曲，选择歌词，生成精美图片</p>
                </div>
                <form id="search-form">
                    <div class="search-box">
                        <img src="assets/img/search.png" alt="搜索" class="search-icon-img" width="22" height="22">
                        <input type="text" id="search-input" class="search-input" placeholder="输入歌曲名或歌手名...">
                    </div>
                    <button type="submit" class="btn primary" id="search-btn">
                        <img src="assets/img/search.png" alt="搜索" class="btn-icon-img" width="20" height="20">
                        搜索歌曲
                    </button>
                </form>
                <div class="home-features">
                    <div class="feature">
                        <img src="assets/img/music_2.png" alt="歌词" class="feature-icon-img" width="24" height="24">
                        <span>海量歌词</span>
                    </div>
                    <div class="feature">
                        <img src="assets/img/image.png" alt="卡片" class="feature-icon-img" width="24" height="24">
                        <span>精美卡片</span>
                    </div>
                    <div class="feature">
                        <img src="assets/img/download.png" alt="下载" class="feature-icon-img" width="24" height="24">
                        <span>一键下载</span>
                    </div>
                </div>
                <div class="loading hidden">
                    <div class="spinner"></div>
                    <span>搜索中...</span>
                </div>
                <div class="error hidden"></div>
            </div>
        </section>

        <!-- 步骤 2: 选择歌曲 -->
        <section class="screen" data-step="2">
            <div class="screen-content">
                <header>
                    <button class="btn-icon back-btn" data-to="1">
                        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    </button>
                    <h2>选择歌曲</h2>
                </header>
                <div class="song-list" id="song-list"></div>
                <div class="loading hidden">
                    <div class="spinner"></div>
                    <span>加载中...</span>
                </div>
            </div>
        </section>

        <!-- 步骤 3: 选择歌词 -->
        <section class="screen" data-step="3">
            <div class="screen-content">
                <header>
                    <button class="btn-icon back-btn" data-to="2">
                        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    </button>
                    <h2>选择歌词</h2>
                    <button class="btn-icon" id="convert-btn" title="繁体转简体">
                        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
                    </button>
                    <button class="btn-icon next-btn" id="to-preview">
                        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                    </button>
                </header>
                <p class="hint">点击选择要显示的歌词行</p>
                <div class="lyrics-list" id="lyrics-list"></div>
                <div class="loading hidden">
                    <div class="spinner"></div>
                    <span>加载歌词中...</span>
                </div>
            </div>
        </section>

        <!-- 步骤 4: 预览和自定义 -->
        <section class="screen" data-step="4">
            <div class="screen-content">
                <header>
                    <button class="btn-icon back-btn" data-to="3">
                        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    </button>
                    <h2>自定义图片</h2>
                    <button class="btn-icon" id="download-btn">
                        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
                    </button>
                </header>

                <!-- 图片预览 -->
                <div class="preview-container">
                    <div class="song-card" id="song-card">
                        <div class="card-header">
                            <div class="cover-wrapper" id="cover-wrapper">
                                <img src="" alt="封面" class="cover-img" id="cover-img">
                                <div class="cover-loading hidden" id="cover-loading">
                                    <div class="spinner-small"></div>
                                </div>
                            </div>
                            <div class="song-info">
                                <div class="song-name" contenteditable="true" id="song-name">歌曲名</div>
                                <div class="artist-name" contenteditable="true" id="artist-name">歌手</div>
                            </div>
                        </div>
                        <div class="card-lyrics" contenteditable="true" id="card-lyrics">
                            选择的歌词将显示在这里
                        </div>
                    </div>
                </div>

                <!-- 自定义选项 -->
                <div class="options">
                    <!-- 封面操作 -->
                    <div class="option-group">
                        <label class="option-label">专辑封面</label>
                        <div class="cover-actions">
                            <input type="file" id="cover-input" accept="image/*" hidden>
                            <button class="btn secondary small" id="fetch-cover-btn">
                                <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18 13v7H4V6h5.02c.05-.71.22-1.38.48-2H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-5l-2-2zm-1.5 5h-11l2.75-3.53 1.96 2.36 2.75-3.54zm2.8-9.11c.44-.7.7-1.51.7-2.39C20 4.01 17.99 2 15.5 2S11 4.01 11 6.5s2.01 4.5 4.5 4.5c.88 0 1.69-.26 2.39-.7L21 13.42 22.42 12l-3.12-3.11zM15.5 9C14.12 9 13 7.88 13 6.5S14.12 4 15.5 4 18 5.12 18 6.5 16.88 9 15.5 9z"/></svg>
                                自动获取
                            </button>
                            <button class="btn secondary small" id="upload-cover-btn">
                                <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                                本地上传
                            </button>
                        </div>
                    </div>

                    <!-- 颜色选择 -->
                    <div class="option-group">
                        <label class="option-label">背景颜色</label>
                        <div class="color-picker">
                            <div class="color-preset" style="background: #1DB954" data-color="#1DB954"></div>
                            <div class="color-preset" style="background: #E91E63" data-color="#E91E63"></div>
                            <div class="color-preset" style="background: #9C27B0" data-color="#9C27B0"></div>
                            <div class="color-preset" style="background: #3F51B5" data-color="#3F51B5"></div>
                            <div class="color-preset" style="background: #00BCD4" data-color="#00BCD4"></div>
                            <div class="color-preset" style="background: #FF9800" data-color="#FF9800"></div>
                            <div class="color-preset" style="background: #795548" data-color="#795548"></div>
                            <div class="color-custom" id="color-custom-btn" title="自定义颜色">
                                <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                                <input type="color" id="custom-color" value="#1DB954">
                            </div>
                        </div>
                    </div>

                    <!-- 文字颜色 -->
                    <div class="option-group">
                        <label class="switch-label">
                            <span>浅色文字</span>
                            <div class="switch" id="light-text-switch">
                                <div class="switch-thumb"></div>
                            </div>
                        </label>
                    </div>

                    <!-- 歌词对齐 -->
                    <div class="option-group">
                        <label class="option-label">歌词对齐</label>
                        <div class="align-picker">
                            <button class="align-btn active" data-align="left" title="居左">
                                <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M15 15H3v2h12v-2zm0-8H3v2h12V7zM3 13h18v-2H3v2zm0 8h18v-2H3v2zM3 3v2h18V3H3z"/></svg>
                            </button>
                            <button class="align-btn" data-align="center" title="居中">
                                <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 15v2h10v-2H7zm-4 6h18v-2H3v2zm0-8h18v-2H3v2zm4-6v2h10V7H7zM3 3v2h18V3H3z"/></svg>
                            </button>
                            <button class="align-btn" data-align="right" title="居右">
                                <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 21h18v-2H3v2zm6-4h12v-2H9v2zm-6-4h18v-2H3v2zm6-4h12V7H9v2zM3 3v2h18V3H3z"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- 行间距 -->
                    <div class="option-group">
                        <label class="option-label">行间距 <span id="line-height-value">1.6</span></label>
                        <input type="range" id="line-height-slider" class="slider" min="1" max="2.5" step="0.1" value="1.6">
                    </div>
                </div>

                <div class="loading hidden">
                    <div class="spinner"></div>
                    <span>生成图片中...</span>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <span>歌词图片生成器</span>
            <button class="btn-icon" id="theme-toggle">
                <svg class="icon icon-light-mode" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
                <svg class="icon icon-dark-mode" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
            </button>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/imageGenerator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
